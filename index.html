<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Perpustakaan Cakrawala Ilmu</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-4 text-center" style="max-width:420px; width:100%;">

        <img src="assets/img/Logo.png" width="120" class="mx-auto mb-3">

        <h3>Perpustakaan Cakrawala Ilmu</h3>

        <p class="text-muted">Silakan Login</p>

        <div class="mb-3">
            <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Username">
        </div>

        <div class="mb-3">
            <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Password">
        </div>

        <button
            id="btnLogin"
            class="btn btn-primary w-100">
            Login
        </button>

    </div>

</div>

<script src="assets/js/main.js"></script>

</body>
</html>
