<body>

<div class="container-fluid vh-100">
    <div class="row h-100">

        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-success text-white">
            <div class="text-center">
                <img src="assets/img/logo.png" width="180" class="mb-4">
                <h2>Perpustakaan Cakrawala Ilmu</h2>
                <p>Sistem Pendataan Pengunjung Perpustakaan</p>
            </div>
        </div>

        <div class="col-lg-6 d-flex align-items-center justify-content-center">

            <div class="card shadow-lg p-4" style="width:400px; border-radius:20px;">

                <h3 class="text-center mb-4">
                    Login Admin
                </h3>

                <div class="mb-3">
                    <label>Username</label>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Masukkan Username">
                </div>

                <div class="mb-4">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Masukkan Password">
                </div>

                <button
                    id="btnLogin"
                    class="btn btn-success w-100">

                    Login

                </button>

            </div>

        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/main.js"></script>

</body>
