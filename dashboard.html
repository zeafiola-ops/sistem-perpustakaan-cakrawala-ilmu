<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Perpustakaan Cakrawala Ilmu</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="text-center mb-4">

            <img src="assets/img/Logo.png" alt="Logo">

            <h4 class="mt-3">Perpustakaan</h4>
            <small>Cakrawala Ilmu</small>

        </div>

        <hr>

        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>

        <a href="data-buku.html">
            <i class="fa-solid fa-book"></i>
            Data Buku
        </a>

        <a href="data-pengunjung.html">
            <i class="fa-solid fa-users"></i>
            Data Pengunjung
        </a>

        <a href="laporan.html">
            <i class="fa-solid fa-chart-column"></i>
            Laporan
        </a>

        <a href="tentang.html">
            <i class="fa-solid fa-circle-info"></i>
            Tentang
        </a>

        <a href="index.html" id="btnLogout">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>

    </div>

    <!-- Content -->
<div class="content">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4 px-4">

        <div class="container-fluid">

            <h4 class="mb-0">
                Dashboard
            </h4>

            <div class="d-flex align-items-center">

                <span id="jam" class="me-4 fw-bold"></span>

                <button class="btn btn-outline-secondary btn-sm me-2">
                    🌙
                </button>

                <button class="btn btn-outline-primary btn-sm me-3">
                    ID
                </button>

                <img src="assets/img/Logo.png"
                     width="40"
                     class="rounded-circle">

            </div>

        </div>

    </nav>

    <div class="row">

        <div class="row">

            <div class="col-md-3 mb-3">
                <div class="card shadow p-3">
                    <h5>Total Buku</h5>
                    <h2>50</h2>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card shadow p-3">
                    <h5>Pengunjung</h5>
                    <h2>120</h2>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card shadow p-3">
                    <h5>Dipinjam</h5>
                    <h2>15</h2>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card shadow p-3">
                    <h5>Tersedia</h5>
                    <h2>35</h2>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="assets/js/main.js"></script>

</body>
</html>
